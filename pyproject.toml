[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabicocr-khatt"
version = "0.1.0"
description = "Arabic handwritten text recognition — CRNN-CTC with Arabic-specific multi-scale vertical encoding, trained on the KHATT dataset"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Osama Sharaf" }]
keywords = [
    "arabic", "ocr", "htr", "handwriting", "handwritten-text-recognition",
    "khatt", "crnn", "ctc", "pytorch", "rtl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "rapidfuzz>=3.6",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
demo = ["gradio>=4.0", "pandas>=2.0", "torchvision>=0.17"]
train = ["pandas>=2.0", "scikit-learn>=1.3", "torchvision>=0.17"]

[project.urls]
Homepage = "https://github.com/FixFips/ArabicOCR_KHATT"
Repository = "https://github.com/FixFips/ArabicOCR_KHATT"
Issues = "https://github.com/FixFips/ArabicOCR_KHATT/issues"

[project.scripts]
arabicocr = "arabicocr_khatt.pipeline:main"

[tool.setuptools]
packages = ["arabicocr_khatt"]

[tool.setuptools.package-data]
arabicocr_khatt = ["charset_arabic.txt"]
